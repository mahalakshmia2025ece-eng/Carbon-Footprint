<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CarbonTrack - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dff5e1, #b7e4c7);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;

            box-shadow:
                    0 8px 25px rgba(0, 0, 0, 0.15);

            text-align: center;
        }

        .logo {
            font-size: 42px;
            margin-bottom: 5px;
        }

        h1 {
            margin: 5px 0;
            color: #1b5e20;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2e7d32;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;

            border: none;
            border-radius: 8px;

            background: #2e7d32;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        .register-link {
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }

        .register-link a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: bold;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="logo">🌱</div>

    <h1>CarbonTrack</h1>

    <p class="subtitle">
        Household Carbon Footprint Tracker
    </p>

    <form id="loginForm">

        <input
                type="email"
                id="email"
                placeholder="Email"
                required
        >

        <input
                type="password"
                id="password"
                placeholder="Password"
                required
        >

        <select id="role" required>

            <option value="">
                Select Role
            </option>

            <option value="HOUSEHOLD">
                Household
            </option>

            <option value="ADMIN">
                Admin
            </option>

        </select>

        <button type="submit">
            Login
        </button>

    </form>

    <div id="message"></div>

    <div class="register-link">

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </div>

</div>

<script>

    const API_URL = "http://localhost:8080/api/users";

    document
        .getElementById("loginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            const role =
                document.getElementById("role").value;

            const message =
                document.getElementById("message");

            try {

                const response = await fetch(
                    API_URL + "/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {

                    message.innerText =
                        data.error ||
                        "Invalid email or password";

                    return;
                }

                if (data.role !== role) {

                    message.innerText =
                        "Selected role does not match the account.";

                    return;
                }

                localStorage.setItem(
                    "userId",
                    data.id
                );

                localStorage.setItem(
                    "userRole",
                    data.role
                );

                localStorage.setItem(
                    "userName",
                    data.name
                );

                if (data.role === "ADMIN") {

                    window.location.href =
                        "admin-dashboard.html";

                } else {

                    window.location.href =
                        "household-dashboard.html";
                }

            } catch (error) {

                message.innerText =
                    "Unable to connect to server.";

            }

        });

</script>

</body>

</html>
