<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CarbonTrack - Register</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dff5e1, #b7e4c7);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;

            box-shadow:
                    0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .logo {
            text-align: center;
            font-size: 42px;
        }

        h1 {
            text-align: center;
            color: #1b5e20;
            margin: 5px 0;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 7px 0;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2e7d32;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;

            border: none;
            border-radius: 8px;

            background: #2e7d32;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .login-link a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

    </style>

</head>

<body>

<div class="register-container">

    <div class="logo">🌱</div>

    <h1>Create Account</h1>

    <p class="subtitle">
        Join CarbonTrack
    </p>

    <form id="registerForm">

        <input
                type="text"
                id="name"
                placeholder="Full Name"
                required
        >

        <input
                type="email"
                id="email"
                placeholder="Email"
                required
        >

        <input
                type="password"
                id="password"
                placeholder="Password"
                required
        >

        <button type="submit">
            Register
        </button>

    </form>

    <div id="message"></div>

    <div class="login-link">

        Already have an account?

        <a href="index.html">
            Login
        </a>

    </div>

</div>

<script>

    const API_URL =
        "http://localhost:8080/api/users";

    document
        .getElementById("registerForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const name =
                document.getElementById("name").value;

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");

            try {

                const response = await fetch(
                    API_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            name: name,
                            email: email,
                            password: password,
                            role: "HOUSEHOLD"
                        })
                    }
                );

                const data =
                    await response.json();

                if (!response.ok) {

                    message.innerText =
                        data.error ||
                        "Registration failed.";

                    return;
                }

                message.innerText =
                    "Registration successful! Redirecting...";

                setTimeout(function() {

                    window.location.href =
                        "index.html";

                }, 1200);

            } catch (error) {

                message.innerText =
                    "Unable to connect to server.";

            }

        });

</script>

</body>

</html>
